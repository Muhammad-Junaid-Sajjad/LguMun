<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - LGU MUN 2026</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="/"><img src="assets/logo/lgumun-logo.png" alt="LGU MUN Logo" class="navbar-logo"></a>
      <ul class="navbar-links">
        <li><a href="/">Home</a></li>
        <li><a href="/committees.html">Committees</a></li>
        <li><a href="/register.html">Register</a></li>
      </ul>
    </div>
  </nav>

  <!-- Registration Form -->
  <section class="container" style="max-width: 600px; margin: 3rem auto;">
    <h1 class="text-center mb-4">Delegate Registration</h1>

    <!-- Global Error Banner -->
    <div id="error-banner" class="error-banner">
      <span id="error-message"></span>
    </div>

    <form id="registration-form">
      <div class="form-field" id="full_name-field">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" placeholder="Enter your full name">
        <span id="full_name-error" class="error-text"></span>
      </div>

      <div class="form-field" id="student_id_cnic-field">
        <label for="student_id_cnic">Student ID / CNIC</label>
        <input type="text" id="student_id_cnic" name="student_id_cnic" placeholder="e.g. 12345-1234567-1">
        <span id="student_id_cnic-error" class="error-text"></span>
      </div>

      <div class="form-field" id="email-field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="your.email@domain.com">
        <span id="email-error" class="error-text"></span>
      </div>

      <div class="form-field" id="phone-field">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="03001234567">
        <span id="phone-error" class="error-text"></span>
      </div>

      <div class="form-field" id="institution-field">
        <label for="institution">Institution Name</label>
        <input type="text" id="institution" name="institution" placeholder="Your university/school">
        <span id="institution-error" class="error-text"></span>
      </div>

      <div class="form-field" id="committee_id-field">
        <label for="committee_id">Select Committee</label>
        <select id="committee_id" name="committee_id">
          <option value="">-- Select a Committee --</option>
        </select>
        <span id="committee_id-error" class="error-text"></span>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
        Register
      </button>
    </form>

    <p class="text-center mt-4">
      <a href="/committees.html">View all committees &rarr;</a>
    </p>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 LGU MUN Society. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
