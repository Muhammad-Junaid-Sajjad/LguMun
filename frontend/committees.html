<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Committees - LGU MUN 2026</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-brand">
      <img src="assets/logo/lgumun-logo.png" alt="LGU MUN Logo" class="navbar-logo">
      <span class="navbar-title">LGU MUN 2026</span>
    </div>
    <ul class="navbar-links">
      <li><a href="/">Home</a></li>
      <li><a href="/committees.html" class="active">Committees</a></li>
      <li><a href="/register.html">Register</a></li>
    </ul>
  </nav>

  <!-- Committees Section -->
  <div class="committees-container">
    <div class="committees-header">
      <span class="committees-title">All Committees</span>
      <span class="committees-count" id="committees-count">9 committees · 255 total seats</span>
    </div>

    <!-- Loading Skeleton -->
    <div id="loading-skeleton" class="committees-grid">
      <div class="committee-card"><div style="height: 100px;"></div></div>
      <div class="committee-card"><div style="height: 100px;"></div></div>
      <div class="committee-card"><div style="height: 100px;"></div></div>
      <div class="committee-card"><div style="height: 100px;"></div></div>
      <div class="committee-card"><div style="height: 100px;"></div></div>
      <div class="committee-card"><div style="height: 100px;"></div></div>
      <div class="committee-card"><div style="height: 100px;"></div></div>
      <div class="committee-card"><div style="height: 100px;"></div></div>
      <div class="committee-card"><div style="height: 100px;"></div></div>
    </div>

    <!-- Committees Grid -->
    <div id="committees-grid" class="committees-grid"></div>

    <!-- Error State -->
    <div id="error-state" class="hidden">
      <div class="details-card text-center">
        <h2 style="color: var(--color-error);">Failed to Load Committees</h2>
        <p>Please try again later.</p>
        <button onclick="location.reload()" class="btn btn-primary">Retry</button>
      </div>
    </div>

    <!-- CTA -->
    <div class="committees-cta">
      <a href="/register.html" class="btn btn-primary">Register as Delegate</a>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    © 2026 LGU MUN Society · Lahore Garrison University
  </footer>

  <script src="js/api.js"></script>
  <script src="js/committees.js"></script>
</body>
</html>
